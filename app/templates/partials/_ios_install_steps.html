<li>Tap the <strong>menu button</strong> (three lines) in Safari's address bar, then <strong>Share</strong>. On older iOS, tap the <strong>Share icon</strong> (square with upward arrow) instead.</li>
<li>Tap <strong>View More</strong>, then <strong>"Add to Home Screen"</strong>.</li>
<li>Leave <strong>"Open as Web App"</strong> on and tap <strong>Add</strong>.</li>
