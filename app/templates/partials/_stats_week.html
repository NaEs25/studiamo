{# Stats tab: last seven days chart. Filled by loadStatsActivity() in settings.js. #}
<div class="bg-white p-5 rounded-2xl border border-stone-200 space-y-4">
    <h3 class="font-bold text-base flex items-center space-x-2">
        <i data-lucide="bar-chart-3" class="w-5 h-5 text-amber-600"></i>
        <span>Last 7 days</span>
    </h3>
    <div id="stats-week-chart" class="grid grid-cols-7 gap-2" role="img" aria-label="Quizzes and XP for each of the last seven days"></div>
    <p class="text-[11px] text-stone-500">Bars show quizzes done per day, the number below is XP earned.</p>
</div>
