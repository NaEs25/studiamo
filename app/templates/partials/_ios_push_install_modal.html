<!-- Overlay: iPhone/iPad Home Screen install walkthrough. settings.js opens it from the Install as
     App button (data-purpose="install") and when the Browser Push switch is turned on outside an
     installed app (data-purpose="push"), since iOS only delivers push to a Home Screen install.
     The variants and steps live in _ios_install_guide.html, shared with the onboarding. -->
<div id="overlay-ios-push-install"
    class="app-overlay fixed inset-0 bg-stone-950/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto"
    role="dialog" aria-modal="true" aria-labelledby="ios-push-install-title">
    <div class="bg-white border border-stone-200 rounded-2xl p-5 max-w-sm w-full shadow-2xl space-y-3 max-h-[95dvh] overflow-y-auto" data-variant="safari" data-purpose="push">
        <div class="flex items-start justify-between gap-3">
            <h3 id="ios-push-install-title" class="font-extrabold text-stone-900 text-base flex items-center space-x-2">
                <i data-lucide="smartphone" class="w-4 h-4 text-amber-600 shrink-0"></i>
                <span class="ios-push-safari-only ios-push-for-push">Add to Home Screen first</span>
                <span class="ios-push-safari-only ios-push-for-install">Add to Home Screen</span>
                <span class="ios-push-other-only">Open Studiamo in Safari</span>
            </h3>
            <button type="button" id="btn-close-ios-push-install"
                class="text-stone-500 hover:text-stone-900 transition p-1 -m-1" aria-label="Close">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <p class="ios-push-safari-only ios-push-for-push text-xs text-stone-600 leading-snug">On iPhone / iPad, push
            notifications only work in the Home Screen app. Here's how to add it:</p>
        <p class="ios-push-safari-only ios-push-for-install text-xs text-stone-600 leading-snug">Open Studiamo
            like an app, full screen and with notifications. Here's how:</p>

        {% include 'partials/_ios_install_guide.html' %}

        <button type="button" id="btn-ios-push-install-done"
            class="ios-push-safari-only btn-primary w-full py-2.5 font-bold text-xs rounded-xl transition">Got it</button>
    </div>
</div>
