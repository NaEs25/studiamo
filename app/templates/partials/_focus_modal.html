<!-- Learning-focus overlay, opened from a video card's 3-dot menu (openFocusModal in videos.js).
     Content is rendered client-side from GET /api/videos/{id}/concept-pool. -->
<div id="overlay-focus" role="dialog" aria-modal="true" aria-labelledby="focus-modal-title"
    class="hidden fixed inset-0 bg-stone-950/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-white border border-[#e7dfd3] rounded-3xl w-full max-w-lg shadow-2xl flex flex-col max-h-[88vh]">

        <div class="flex items-start justify-between p-5 pb-3 border-b border-[#e7dfd3] shrink-0">
            <div class="min-w-0 pr-3">
                <h3 id="focus-modal-title" class="text-base font-extrabold text-stone-900 flex items-center space-x-2">
                    <i data-lucide="target" class="w-4 h-4 text-amber-600 shrink-0"></i>
                    <span>Adjust Learning Focus</span>
                </h3>
                <p id="focus-modal-subtitle" class="text-xs text-stone-500 mt-0.5 truncate"></p>
            </div>
            <button id="btn-close-focus" aria-label="Close"
                class="p-2 rounded-lg text-stone-500 hover:text-stone-900 hover:bg-stone-100 transition shrink-0">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>

        <div id="focus-stage-tabs" class="flex items-center gap-1 px-5 py-2.5 overflow-x-auto border-b border-[#e7dfd3] shrink-0"></div>

        <div class="px-5 py-3 overflow-y-auto grow">
            <p class="text-xs text-stone-600 font-medium mb-2.5">Choose the topics you want to actively review:</p>
            <div id="focus-topic-list" class="space-y-1.5"></div>
        </div>

        <div class="p-4 border-t border-[#e7dfd3] space-y-3 shrink-0">
            <div id="focus-status" class="text-xs font-semibold rounded-xl px-3 py-2 border"></div>
            <div class="flex items-center gap-2">
                <button id="btn-focus-reset"
                    class="flex-1 py-2.5 bg-stone-100 hover:bg-stone-200 border border-stone-200 text-stone-700 font-bold rounded-xl text-xs transition">
                    Restore AI recommendation
                </button>
                <button id="btn-focus-save"
                    class="btn-primary flex-1 py-2.5 font-extrabold rounded-xl text-xs transition active:scale-[0.98]">
                    Save focus
                </button>
            </div>
        </div>
    </div>
</div>
