<!-- Overlay: what Chompy ate since the user last looked (dashboard chompy.eaten_unseen),
     acknowledged with POST /api/chompy/seen. app.js maybeShowChompyAway picks one of three
     variants by how much he ate:
       1      tickle: tickle him and he spits it out, then the quiz opens
       2 to 4 the notes roll into him on a little belt, then he sits there full, then the list
       5+     the full-belly summary and the list, no animation
     Every list entry wins its quiz back by finishing it (routers/quizzes.py grade_quiz). -->
<div id="overlay-chompy-away"
    class="app-overlay hidden fixed inset-0 bg-stone-950/85 backdrop-blur z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="max-w-md w-full bg-white border border-red-200 rounded-2xl p-5 shadow-2xl space-y-3">
        <h3 id="chompy-away-title" class="text-lg font-extrabold text-stone-900 tracking-tight text-center"></h3>

        <!-- 2 to 4: notes rolling into Chompy -->
        <div id="chompy-away-roll" class="comeback-stage bg-[#fcfaf6] border border-[#e7dfd3] hidden">
            <div class="comeback-roll absolute left-5 bottom-12">
                <div id="chompy-away-roll-notes" class="belt-stack"></div>
            </div>
            <div class="belt-track belt-track-run" aria-hidden="true"></div>
            <img src="/static/images/chompy/chompy-chomping.png" alt="Chompy eating"
                class="chompy-chomp absolute right-2 bottom-1 w-32 h-auto">
        </div>

        <!-- Full belly with the count -->
        <div id="chompy-away-full" class="comeback-stage bg-red-50 flex items-end justify-center hidden">
            <img src="/static/images/chompy/chompy-full.png" alt="Chompy, full and sleepy" class="w-32 h-auto mb-1">
            <div id="chompy-away-bubble"
                class="absolute right-16 top-4 bg-white border-2 border-stone-900 rounded-2xl px-3 py-1 text-xl font-extrabold text-red-800"></div>
        </div>

        <!-- 1: tickle him -->
        <div id="chompy-away-tickle" class="hidden space-y-3 text-center">
            <img id="chompy-away-tickle-img" src="/static/images/chompy/chompy-full.png" alt="Chompy"
                class="w-36 h-auto mx-auto">
            <p class="text-sm text-stone-700 leading-snug">Tickle him and he spits it back out. Finish the quiz and
                it's yours again.</p>
            <div class="flex items-center justify-center gap-2">
                <button type="button" id="chompy-away-later"
                    class="px-4 py-2.5 min-h-[44px] font-bold text-xs rounded-xl transition text-stone-600 hover:bg-stone-100">Later</button>
                <button type="button" id="chompy-away-tickle-btn"
                    class="btn-primary px-5 py-2.5 min-h-[44px] font-extrabold text-xs rounded-xl transition">Tickle Chompy</button>
            </div>
        </div>

        <!-- 2+: what he ate, each won back by finishing its quiz -->
        <div id="chompy-away-list" class="hidden space-y-3">
            <div id="chompy-away-items" class="space-y-2 max-h-64 overflow-y-auto"></div>
        </div>

        <div id="chompy-away-info" class="flex items-start space-x-2 text-left text-xs text-stone-700 bg-[#fbf8f2] p-3 rounded-xl border border-[#e7dfd3]">
            <i data-lucide="info" class="w-4 h-4 text-amber-700 shrink-0 mt-0.5"></i>
            <p class="leading-snug">Nothing is lost. Your videos, notes and quizzes are all still there, only their
                reviews are paused until you win them back.</p>
        </div>
        <div id="chompy-away-footer" class="flex items-center justify-end">
            <button type="button" id="chompy-away-close"
                class="px-4 py-2.5 min-h-[44px] font-bold text-xs rounded-xl transition text-stone-600 hover:bg-stone-100">Done</button>
        </div>
    </div>
</div>
