{# Stats tab: monthly streak calendar. Filled by loadStatsActivity() in settings.js. #}
<div class="bg-white p-5 rounded-2xl border border-stone-200 space-y-4">
    <div class="flex items-center justify-between">
        <h3 class="font-bold text-base flex items-center space-x-2">
            <i data-lucide="calendar-days" class="w-5 h-5 text-amber-600"></i>
            <span>Streak calendar</span>
        </h3>
        <div class="flex items-center space-x-1">
            <button type="button" id="stats-cal-prev" aria-label="Previous month"
                class="p-1.5 rounded-lg border border-stone-200 text-stone-600 disabled:opacity-30">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <span id="stats-cal-label" class="text-xs font-semibold text-stone-700 w-28 text-center"></span>
            <button type="button" id="stats-cal-next" aria-label="Next month"
                class="p-1.5 rounded-lg border border-stone-200 text-stone-600 disabled:opacity-30">
                <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
        </div>
    </div>
    <div class="streak-cal-grid text-[11px] font-bold text-stone-500 text-center" id="stats-cal-head"></div>
    <div id="stats-cal-grid" class="streak-cal-grid"></div>
</div>
