<script>
    // Timestamps are stored in UTC; converting to the viewer's own local time here (rather
    // than server-side, where the user's timezone isn't known) mirrors how the app itself
    // formats dates in the browser.
    document.querySelectorAll("time[datetime]").forEach(function (el) {
        var d = new Date(el.getAttribute("datetime"));
        if (!isNaN(d.getTime())) {
            el.textContent = d.toLocaleString(undefined, {
                month: "short", day: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit"
            });
        }
    });
</script>
